<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>InternLoom | Live Dashboard</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                    },
                    borderRadius: { 'none': '0px', 'sm': '0px', DEFAULT: '0px', 'md': '0px', 'lg': '0px', 'xl': '0px', '2xl': '0px', '3xl': '0px', 'full': '0px' },
                    colors: { 'brand-accent': '#0f172a' }
                }
            }
        }
    </script>
    <style>
        * { border-radius: 0 !important; }
        body { background-color: #f8fafc; color: #0f172a; }
        
        .sharp-card {
            background-color: white;
            border: 1px solid #cbd5e1;
            box-shadow: 4px 4px 0px 0px rgba(15, 23, 42, 0.1);
            transition: all 0.2s ease;
        }
        .sharp-card:hover {
            transform: translate(-2px, -2px);
            box-shadow: 6px 6px 0px 0px rgba(15, 23, 42, 0.15);
            border-color: #94a3b8;
        }
        .sharp-input {
            border: 1px solid #cbd5e1;
            background-color: #f8fafc;
            transition: all 0.2s;
        }
        .sharp-input:focus {
            outline: none;
            border-color: #0f172a;
            box-shadow: 2px 2px 0px 0px rgba(15, 23, 42, 0.1);
        }
        .sharp-button {
            border: 1px solid transparent;
            transition: all 0.15s ease;
        }
        .sharp-button:hover {
            background-color: transparent;
            color: #0f172a;
            border-color: #0f172a;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <div id="login-view" class="flex-grow flex items-center justify-center p-6 hidden">
        <div class="sharp-card p-10 w-full max-w-md">
            <div class="mb-8 border-b border-slate-200 pb-6 text-center">
                <div class="w-12 h-12 bg-slate-900 mx-auto flex items-center justify-center text-white font-bold font-mono text-lg mb-4">IL</div>
                <h2 class="text-2xl font-bold tracking-tight uppercase">InternLoom</h2>
                <p class="text-xs text-slate-500 font-mono mt-2">SYSTEM AUTHENTICATION</p>
            </div>
            
            <form id="login-form" class="space-y-6">
                <div>
                    <label class="block text-xs font-bold text-slate-700 uppercase tracking-widest mb-2">College Email</label>
                    <input type="email" id="email" required class="sharp-input w-full p-3 text-sm font-mono" placeholder="student@college.edu">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-700 uppercase tracking-widest mb-2">Password</label>
                    <input type="password" id="password" required class="sharp-input w-full p-3 text-sm font-mono" placeholder="••••••••">
                </div>
                <div id="login-error" class="text-red-600 text-xs font-bold hidden bg-red-50 p-3 border border-red-200"></div>
                <button type="submit" class="w-full bg-slate-900 text-white font-bold uppercase tracking-widest p-4 text-sm sharp-button">
                    Initialize Session
                </button>
            </form>
        </div>
    </div>

    <div id="dashboard-view" class="hidden flex-col flex-grow w-full">
        <header class="bg-white border-b border-slate-300 px-6 py-4 flex justify-between items-center sticky top-0 z-10">
            <div class="flex items-center gap-3">
                <div class="w-8 h-8 bg-slate-900 flex items-center justify-center text-white font-bold font-mono text-sm">IL</div>
                <h1 class="text-xl font-bold tracking-tight uppercase">
                    InternLoom <span class="text-slate-400 font-normal text-lg tracking-normal">v2026</span>
                </h1>
            </div>
            
            <div class="flex items-center gap-6">
                <div class="px-3 py-1 border border-emerald-600 text-emerald-700 bg-emerald-50 text-[10px] font-bold uppercase tracking-widest flex items-center gap-2">
                    <span class="w-2 h-2 bg-emerald-500 block animate-pulse"></span>
                    Live Connection
                </div>
                <button onclick="logout()" class="text-xs font-bold text-slate-500 hover:text-slate-900 uppercase tracking-widest transition-colors">Logout</button>
            </div>
        </header>

        <main class="flex-grow p-6 md:p-12 max-w-6xl mx-auto w-full">
            <div class="mb-10 border-b border-slate-300 pb-6 flex flex-col md:flex-row md:items-end justify-between gap-4">
                <div>
                    <h2 class="text-4xl font-light tracking-tight mb-2 text-slate-900">Student Opportunities</h2>
                    <p class="text-slate-500 text-sm font-medium">Ranked listings generated live from FastAPI backend.</p>
                </div>
                <div class="text-right">
                    <div class="text-xs uppercase tracking-widest text-slate-400 font-bold mb-1">Profile Score</div>
                    <div id="profile-score" class="text-2xl font-mono font-bold text-slate-800">--%</div>
                </div>
            </div>

            <div id="loading-indicator" class="py-12 text-center text-slate-500 font-mono text-sm tracking-widest uppercase animate-pulse">
                Fetching Data from Engine...
            </div>

            <div id="job-feed" class="grid grid-cols-1 lg:grid-cols-2 gap-6 hidden">
                <!-- Jobs injected here -->
            </div>
        </main>
    </div>

    <script>
        const API_URL = "http://127.0.0.1:8000/api/v1";
        
        // DOM Elements
        const loginView = document.getElementById('login-view');
        const dashboardView = document.getElementById('dashboard-view');
        const loginForm = document.getElementById('login-form');
        const loginError = document.getElementById('login-error');
        const jobFeed = document.getElementById('job-feed');
        const loadingIndicator = document.getElementById('loading-indicator');
        const profileScoreEl = document.getElementById('profile-score');

        // Check Auth State on Load
        window.onload = () => {
            const token = localStorage.getItem('il_token');
            if (token) {
                showDashboard();
            } else {
                showLogin();
            }
        };

        function showLogin() {
            loginView.classList.remove('hidden');
            loginView.classList.add('flex');
            dashboardView.classList.add('hidden');
            dashboardView.classList.remove('flex');
        }

        function showDashboard() {
            loginView.classList.add('hidden');
            loginView.classList.remove('flex');
            dashboardView.classList.remove('hidden');
            dashboardView.classList.add('flex');
            fetchProfile();
            fetchJobs();
        }

        function logout() {
            localStorage.removeItem('il_token');
            showLogin();
        }

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            loginError.classList.add('hidden');

            // FastAPI OAuth2 requires x-www-form-urlencoded
            const formData = new URLSearchParams();
            formData.append('username', email);
            formData.append('password', password);

            try {
                const response = await fetch(`${API_URL}/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: formData
                });

                const data = await response.json();
                
                if (response.ok && data.access_token) {
                    localStorage.setItem('il_token', data.access_token);
                    showDashboard();
                } else {
                    loginError.textContent = data.detail || "Authentication failed.";
                    loginError.classList.remove('hidden');
                }
            } catch (err) {
                loginError.textContent = "Server unreachable. Ensure backend is running.";
                loginError.classList.remove('hidden');
            }
        });

        async function fetchProfile() {
            const token = localStorage.getItem('il_token');
            try {
                const res = await fetch(`${API_URL}/students/profile`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                if (res.ok) {
                    const json = await res.json();
                    if(json.data && json.data.completeness_score) {
                        profileScoreEl.textContent = `${json.data.completeness_score}%`;
                    }
                }
            } catch (e) {
                console.error("Profile fetch failed:", e);
            }
        }

        async function fetchJobs() {
            loadingIndicator.classList.remove('hidden');
            jobFeed.classList.add('hidden');
            jobFeed.innerHTML = '';
            
            const token = localStorage.getItem('il_token');

            try {
                const response = await fetch(`${API_URL}/student/feed`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                if (response.status === 401) {
                    logout(); // Token expired
                    return;
                }

                const json = await response.json();
                
                if (response.ok && json.data) {
                    renderJobs(json.data);
                } else {
                    jobFeed.innerHTML = `<div class="col-span-full p-6 bg-red-50 border border-red-200 text-red-700 font-mono text-sm">Error: ${json.detail || 'Failed to load feed'}</div>`;
                }
            } catch (err) {
                jobFeed.innerHTML = `<div class="col-span-full p-6 bg-amber-50 border border-amber-200 text-amber-700 font-mono text-sm">Connection Error. Ensure FastAPI is running on port 8000.</div>`;
            } finally {
                loadingIndicator.classList.add('hidden');
                jobFeed.classList.remove('hidden');
            }
        }

        function getScoreColorClass(score) {
            if (score >= 90) return 'text-emerald-600';
            if (score >= 75) return 'text-amber-600';
            return 'text-slate-600';
        }

        function renderSkills(skills) {
            if(!skills || skills.length === 0) return `<span class="text-xs text-slate-400">No skills listed</span>`;
            // Handle both string arrays and raw JSON strings if DB format varies
            let parsedSkills = typeof skills === 'string' ? JSON.parse(skills) : skills;
            return parsedSkills.map(skill => 
                `<span class="px-2 py-1 bg-slate-100 border border-slate-200 text-slate-700 text-[10px] uppercase font-bold tracking-wider">${skill}</span>`
            ).join('');
        }

        function renderJobs(dataArray) {
            if(dataArray.length === 0) {
                jobFeed.innerHTML = `
                    <div class="col-span-full p-12 text-center border border-slate-300 bg-white">
                        <p class="text-slate-500 font-mono text-sm uppercase tracking-widest">No active listings matching your profile right now.</p>
                    </div>`;
                return;
            }

            dataArray.forEach(item => {
                const job = item.job;
                const scoreColor = getScoreColorClass(item.match_score);
                // Format deadline
                const deadlineDate = new Date(job.deadline).toLocaleDateString();
                
                const cardHTML = `
                    <article class="sharp-card p-6 flex flex-col justify-between h-full group relative overflow-hidden">
                        <div>
                            <div class="flex justify-between items-start mb-2">
                                <div>
                                    <div class="text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-1">REQ ID: ${job.id}</div>
                                    <h3 class="text-xl font-bold text-slate-900 leading-tight">${job.title}</h3>
                                </div>
                                <div class="text-right shrink-0 ml-4">
                                    <div class="text-3xl font-mono font-bold ${scoreColor} leading-none">${item.match_score.toFixed(1)}</div>
                                    <div class="text-[9px] uppercase font-bold text-slate-400 tracking-widest mt-1">Match Score</div>
                                </div>
                            </div>
                            
                            <div class="flex items-center gap-4 text-sm text-slate-600 mb-5 border-b border-slate-100 pb-4 mt-3">
                                <span class="flex items-center gap-1 font-mono text-xs">
                                    <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="square" stroke-linejoin="miter" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"></path></svg>
                                    ${job.location || 'Remote'}
                                </span>
                                <span class="flex items-center gap-1 font-mono text-xs">
                                    <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="square" stroke-linejoin="miter" stroke-width="2" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                                    ${job.stipend || 'Unpaid'}
                                </span>
                            </div>

                            <div class="mb-5 flex flex-wrap gap-2">
                                ${renderSkills(job.required_skills)}
                            </div>

                            <div class="bg-slate-50 p-4 border-l-4 border-slate-900 mb-6">
                                <p class="text-xs text-slate-700 leading-relaxed font-mono">
                                    <span class="font-bold text-slate-900 mr-1 block mb-1">ENGINE ANALYSIS:</span> 
                                    ${item.match_reasoning || 'General profile alignment calculated.'}
                                </p>
                            </div>
                        </div>

                        <div class="flex items-center justify-between mt-auto pt-4 border-t border-slate-200">
                            <span class="text-[10px] text-slate-500 font-mono font-bold uppercase">Closes: ${deadlineDate}</span>
                            <button onclick="alert('Sending POST request to /api/v1/jobs/${job.id}/apply...')" class="bg-brand-accent text-white px-6 py-2.5 text-xs uppercase tracking-widest font-bold sharp-button">
                                Apply Role
                            </button>
                        </div>
                    </article>
                `;
                jobFeed.innerHTML += cardHTML;
            });
        }
    </script>
</body>
</html>
